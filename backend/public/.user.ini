; PHP-FPM / FastCGI reads this file for requests served from public/.
; Bill files can be up to 10 MB (docs/api.md). PHP's usual defaults
; (2M per file, 8M per request) would reject ordinary phone photos.
; Keep these in step with App\Support\UploadLimits::PHP_INI.
upload_max_filesize = 12M
post_max_size = 16M
