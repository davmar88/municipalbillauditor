; RevenueGuard's PHP-FPM pool. Installed by deploy/setup.sh into
; /etc/php/<version>/fpm/pool.d/. Cable Elite keeps the default www pool.
;
; The pool runs as its own user, so RevenueGuard's PHP can't read Cable
; Elite's files and Cable Elite's PHP can't read RevenueGuard's .env or bills.
;
; open_basedir keeps RevenueGuard's own web requests inside the app folder.
; It is not a wall against whoever can write to this socket: a FastCGI client
; can override php_admin_value per request. The socket belongs to www-data
; because nginx needs it, and Cable Elite's PHP is www-data too, so code
; already running as Cable Elite could still reach this pool. See "One limit
; to know about" in DEPLOY.md.

[revenueguard]
user = revenueguard
group = revenueguard

listen = /run/php/revenueguard.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 20s
pm.max_requests = 500
request_terminate_timeout = 120s

catch_workers_output = yes
decorate_workers_output = no

php_admin_value[open_basedir] = /var/www/revenueguard/:/etc/ssl/:/usr/share/zoneinfo/
php_admin_value[upload_tmp_dir] = /var/www/revenueguard/storage/tmp
php_admin_value[sys_temp_dir] = /var/www/revenueguard/storage/tmp
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 26M
php_admin_value[memory_limit] = 256M
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
