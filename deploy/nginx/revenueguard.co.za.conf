# The old address. Every page on revenueguard.co.za forwards to the same page
# on animalfarm.cc, so old links and bookmarks still land. It keeps its own
# certificate, so https:// links forward too, and Certbot keeps renewing it:
# its HTTP check gets past the redirect.
#
# setup.sh only installs the animalfarm.cc site. Copy this one into
# /etc/nginx/sites-available/revenueguard.co.za by hand, then run
# `sudo nginx -t && sudo systemctl reload nginx`.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name revenueguard.co.za www.revenueguard.co.za;

    ssl_certificate /etc/letsencrypt/live/revenueguard.co.za/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/revenueguard.co.za/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    access_log /var/log/nginx/revenueguard.access.log;
    error_log  /var/log/nginx/revenueguard.error.log;

    return 301 https://animalfarm.cc$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name revenueguard.co.za www.revenueguard.co.za;

    access_log /var/log/nginx/revenueguard.access.log;
    error_log  /var/log/nginx/revenueguard.error.log;

    return 301 https://animalfarm.cc$request_uri;
}
