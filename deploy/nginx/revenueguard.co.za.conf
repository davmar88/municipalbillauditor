# RevenueGuard, before HTTPS. Once DNS for revenueguard.co.za points at this
# server, run:
#   sudo certbot --nginx -d revenueguard.co.za -d www.revenueguard.co.za
# and Certbot adds the 443 block and the HTTP->HTTPS redirect itself.
#
# This file sits next to Cable Elite's site and changes nothing about it:
# nginx picks the site by its server_name.
server {
    listen 80;
    listen [::]:80;
    server_name revenueguard.co.za www.revenueguard.co.za;
    root /var/www/revenueguard/public;

    # One canonical host: sessions are per host, and Google shouldn't index
    # the site twice.
    if ($host = www.revenueguard.co.za) {
        return 301 https://revenueguard.co.za$request_uri;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    index index.php;
    charset utf-8;

    access_log /var/log/nginx/revenueguard.access.log;
    error_log  /var/log/nginx/revenueguard.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets have content hashes in their names, so they never change.
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # RevenueGuard's own PHP pool, running as the revenueguard user, so
    # neither site's PHP can read the other's files.
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/revenueguard.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
        # The sign-in page's headers (Vite's preload Link header and the
        # session cookies) pass nginx's default 4 KB, which answers 502.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # The game takes no uploads: its forms and chat messages are small.
    client_max_body_size 2m;
}
